---
layout: default
---
<article class="post">
  <h1 class="page-title">{{ page.title | escape }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
  </p>

  {{ content }}

  <p class="post-back"><a href="{{ '/writing/' | relative_url }}">&larr; All writing</a></p>
</article>
