<dialog class="palette" id="search-dialog" aria-label="Search this site">
  <div class="palette-box">
    <div class="palette-field">
      <svg class="palette-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="8.6" cy="8.6" r="5.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <line x1="12.7" y1="12.7" x2="17" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <label class="visually-hidden" for="search-input">Search this site</label>
      <input type="search" id="search-input" class="palette-input" placeholder="Search&hellip;"
             autocomplete="off" autocorrect="off" spellcheck="false"
             role="combobox" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list">
      <kbd class="palette-key">esc</kbd>
    </div>

    <ul class="palette-results" id="search-results" role="listbox" aria-label="Results"></ul>

    <p class="palette-hint">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> to move</span>
      <span><kbd>&crarr;</kbd> to open</span>
    </p>
  </div>
</dialog>
